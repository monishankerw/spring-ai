<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spring AI • Ollama Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            overflow: hidden;
            background:
                    radial-gradient(circle at 20% 20%, rgba(88, 80, 236, 0.35), transparent 30%),
                    radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.25), transparent 30%),
                    #050510;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite;
        }

        .circle.one {
            width: 250px;
            height: 250px;
            background: #6c5ce7;
            top: 5%;
            left: 5%;
        }

        .circle.two {
            width: 180px;
            height: 180px;
            background: #00d9ff;
            bottom: 10%;
            right: 8%;
            animation-delay: 2s;
        }

        .circle.three {
            width: 120px;
            height: 120px;
            background: #ff4ecd;
            top: 50%;
            right: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(0, -35px, 30px);
            }
        }

        /* Main */
        .container {
            position: relative;
            z-index: 2;

            width: min(1000px, 94%);
            height: 92vh;

            margin: 4vh auto;

            display: flex;
            flex-direction: column;

            background: rgba(15, 15, 35, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 30px;

            backdrop-filter: blur(25px);

            box-shadow:
                    0 30px 80px rgba(0, 0, 0, 0.55),
                    inset 0 1px rgba(255, 255, 255, 0.08);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 22px 28px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 3D Orb */
        .orb {
            width: 55px;
            height: 55px;

            border-radius: 50%;

            background:
                    radial-gradient(circle at 30% 25%,
                    #ffffff 0%,
                    #9c8cff 10%,
                    #6254e7 35%,
                    #201d70 70%,
                    #07071b 100%);

            box-shadow:
                    0 0 20px #665cff,
                    0 0 60px rgba(102, 92, 255, 0.5);

            animation: orb 4s ease-in-out infinite;
        }

        @keyframes orb {
            0%, 100% {
                transform: rotateY(0deg) translateY(0);
            }

            50% {
                transform: rotateY(180deg) translateY(-8px);
            }
        }

        .brand h1 {
            font-size: 20px;
        }

        .brand span {
            font-size: 12px;
            color: #9d9db5;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            color: #9dffbe;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #37ff7c;
            box-shadow: 0 0 12px #37ff7c;
        }

        /* Chat */
        .chat {
            flex: 1;

            padding: 25px;

            overflow-y: auto;

            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            max-width: 78%;

            padding: 15px 18px;

            border-radius: 18px;

            line-height: 1.6;

            animation: messageIn 0.35s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .bot {
            align-self: flex-start;

            background:
                    linear-gradient(
                            135deg,
                            rgba(108, 92, 231, 0.25),
                            rgba(0, 210, 255, 0.08)
                    );

            border: 1px solid rgba(108, 92, 231, 0.3);

            box-shadow:
                    10px 10px 25px rgba(0, 0, 0, 0.2);
        }

        .user {
            align-self: flex-end;

            background:
                    linear-gradient(
                            135deg,
                            #6356e8,
                            #4137a8
                    );

            box-shadow:
                    10px 15px 30px rgba(55, 45, 160, 0.3);
        }

        .message-label {
            font-size: 11px;
            color: #aaa9c2;
            margin-bottom: 5px;
        }

        /* Typing */
        .typing {
            display: none;
            align-self: flex-start;

            padding: 12px 16px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.06);
        }

        .typing span {
            display: inline-block;

            width: 7px;
            height: 7px;

            margin: 0 3px;

            border-radius: 50%;

            background: #aaa;

            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* Input */
        .input-area {
            padding: 20px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);

            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;

            display: flex;
            align-items: center;

            background: rgba(0, 0, 0, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 18px;

            padding: 0 15px;

            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #6c5ce7;

            box-shadow:
                    0 0 20px rgba(108, 92, 231, 0.2);
        }

        #message {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            padding: 15px 5px;

            font-size: 15px;
        }

        #message::placeholder {
            color: #77778d;
        }

        #send {
            width: 55px;
            height: 55px;

            border: none;

            border-radius: 16px;

            cursor: pointer;

            color: white;

            font-size: 20px;

            background:
                    linear-gradient(
                            135deg,
                            #7165ff,
                            #4238bd
                    );

            box-shadow:
                    0 10px 25px rgba(80, 70, 220, 0.4);

            transition: 0.25s;
        }

        #send:hover {
            transform: translateY(-3px) scale(1.04);

            box-shadow:
                    0 15px 35px rgba(80, 70, 220, 0.55);
        }

        #send:active {
            transform: scale(0.95);
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                overflow: auto;
            }

            .container {
                height: 96vh;
                margin: 2vh auto;
                border-radius: 22px;
            }

            .header {
                padding: 18px;
            }

            .chat {
                padding: 18px;
            }

            .message {
                max-width: 88%;
            }

            .input-area {
                padding: 14px;
            }

            .brand h1 {
                font-size: 16px;
            }

            .orb {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
</div>

<div class="container">

    <!-- Header -->
    <header class="header">

        <div class="brand">

            <div class="orb"></div>

            <div>
                <h1>Spring AI • Ollama</h1>
                <span>Llama 3.2 Local AI Assistant</span>
            </div>

        </div>

        <div class="status">
            <div class="status-dot"></div>
            Online
        </div>

    </header>


    <!-- Chat -->
    <main class="chat" id="chat">

        <div class="message bot">

            <div class="message-label">
                Ollama AI
            </div>

            Hello! 👋
            <br>
            I'm running locally using Spring AI + Ollama + Llama 3.2.
            <br><br>
            Ask me anything.
        </div>

        <div class="typing" id="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>


    <!-- Input -->
    <div class="input-area">

        <div class="input-wrapper">

            <input
                    id="message"
                    type="text"
                    placeholder="Ask something..."
                    autocomplete="off"
            >

        </div>

        <button id="send">
            ➤
        </button>

    </div>

</div>


<script>

    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");
    const typing = document.getElementById("typing");


    function addMessage(text, type) {

        const message = document.createElement("div");

        message.className = "message " + type;

        const label =
            type === "user"
                ? "You"
                : "Ollama AI";

        message.innerHTML = `
            <div class="message-label">
                ${label}
            </div>
            ${escapeHtml(text)}
        `;

        chat.insertBefore(message, typing);

        chat.scrollTop = chat.scrollHeight;
    }


    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML
            .replace(/\n/g, "<br>");
    }


    async function sendMessage() {

        const message = input.value.trim();

        if (!message) {
            return;
        }


        // Add user message
        addMessage(message, "user");


        // Clear input
        input.value = "";


        // Disable button
        sendButton.disabled = true;


        // Show typing
        typing.style.display = "block";

        chat.scrollTop = chat.scrollHeight;


        try {

            const url =
                "/api/v1/chat?message=" +
                encodeURIComponent(message);


            const response = await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Server returned " + response.status
                );

            }


            const result =
                await response.text();


            typing.style.display = "none";


            addMessage(result, "bot");


        } catch (error) {

            typing.style.display = "none";


            addMessage(
                "❌ Error: " + error.message,
                "bot"
            );

            console.error(error);

        } finally {

            sendButton.disabled = false;

            input.focus();

        }

    }


    // Send button
    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // Enter key
    input.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


    // Focus input on page load
    input.focus();

</script>

</body>
</html>
